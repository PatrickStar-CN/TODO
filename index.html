<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>待办事项</title>
</head>
<body>
  <div class="app">
    <!-- 左侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>待办事项</h2>
        <span class="date" id="today-date"></span>
        <button class="btn-mini-mode" id="btn-mini-mode" title="迷你模式">⊟</button>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-list="myday">
          <span class="nav-icon">☀️</span>
          <span class="nav-text">TODO</span>
          <span class="nav-count" id="count-myday">0</span>
        </a>
        <a href="#" class="nav-item" data-list="important">
          <span class="nav-icon">⭐</span>
          <span class="nav-text">重要</span>
          <span class="nav-count" id="count-important">0</span>
        </a>
        <a href="#" class="nav-item" data-list="all">
          <span class="nav-icon">🏠</span>
          <span class="nav-text">所有</span>
          <span class="nav-count" id="count-all">0</span>
        </a>
        <a href="#" class="nav-item" data-list="calendar">
          <span class="nav-icon">📅</span>
          <span class="nav-text">日历</span>
          <span class="nav-count"></span>
        </a>
      </nav>
      <div class="sidebar-section">
        <div class="section-title">标签</div>
        <div id="tag-list" class="tag-list"></div>
        <div class="tag-actions">
          <a href="#" class="nav-item add-tag" id="btn-add-tag">
            <span class="nav-icon">+</span>
            <span class="nav-text">新建标签</span>
          </a>
          <a href="#" class="nav-item add-tag" id="btn-manage-tags">
            <span class="nav-icon">⚙️</span>
            <span class="nav-text">管理标签</span>
          </a>
        </div>
      </div>
      <div class="sidebar-footer">
        <button id="btn-clear-done">🗑️ 清空已完成</button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 列表视图 -->
      <div id="view-list" class="view active">
        <div class="main-header">
          <div>
            <h1 id="list-title">TODO</h1>
            <span class="task-summary" id="task-summary"></span>
          </div>
        </div>
        <!-- 添加任务 -->
        <div class="add-task-bar">
          <span class="add-icon">+</span>
          <input type="text" id="quick-add" placeholder="添加新任务..." autocomplete="off">
          <div class="add-task-actions">
            <button class="icon-btn" id="btn-set-date" title="设置日期">📅</button>
            <button class="icon-btn" id="btn-set-priority" title="设置优先级">🚩</button>
            <button class="icon-btn" id="btn-set-tag" title="设置标签">🏷️</button>
          </div>
        </div>
        <!-- 任务列表 -->
        <div id="todo-list" class="todo-list"></div>
        <!-- 已完成折叠 -->
        <div id="done-section" class="done-section">
          <div class="done-header" id="done-toggle">
            <span>已完成 (<span id="done-count">0</span>)</span>
            <span class="arrow">▼</span>
          </div>
          <div id="done-list-wrapper" class="done-list-wrapper">
            <div id="done-list" class="todo-list"></div>
          </div>
        </div>
      </div>

      <!-- 日历视图 -->
      <div id="view-calendar" class="view">
        <div class="main-header">
          <div>
            <h1>日历</h1>
          </div>
        </div>
        <div class="calendar-container">
          <div class="calendar-nav">
            <button class="icon-btn" id="prev-month">◀</button>
            <span id="calendar-title"></span>
            <button class="icon-btn" id="next-month">▶</button>
          </div>
          <div class="calendar-grid">
            <div class="calendar-weekdays">
              <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div id="calendar-days" class="calendar-days"></div>
          </div>
          <div id="calendar-detail" class="calendar-detail"></div>
        </div>
      </div>

      <!-- 底部状态栏 -->
      <div class="status-bar">
        <span id="status-text"></span>
      </div>
    </main>

    <!-- 任务详情面板 -->
    <div id="detail-panel" class="detail-panel hidden">
      <div class="detail-header">
        <h3>编辑任务</h3>
        <button class="icon-btn" id="close-detail">✕</button>
      </div>
      <form id="detail-form">
        <input type="hidden" id="detail-id">
        <div class="detail-row">
          <label>标题</label>
          <input type="text" id="detail-title" required>
        </div>
        <div class="detail-row">
          <label>备注</label>
          <textarea id="detail-desc" placeholder="添加备注..."></textarea>
        </div>
        <div class="detail-row-inline">
          <div class="detail-row">
            <label>优先级</label>
            <select id="detail-priority">
              <option value="none">无</option>
              <option value="low">低</option>
              <option value="medium">中</option>
              <option value="high">高</option>
            </select>
          </div>
          <div class="detail-row">
            <label>标签</label>
            <input type="text" id="detail-tag" placeholder="标签" list="tag-datalist">
            <datalist id="tag-datalist"></datalist>
          </div>
        </div>
        <div class="detail-row-inline">
          <div class="detail-row">
            <label>开始时间</label>
            <input type="datetime-local" id="detail-start">
          </div>
          <div class="detail-row">
            <label>截止时间</label>
            <input type="datetime-local" id="detail-end">
          </div>
        </div>
        <div class="detail-row checkbox-row">
          <label>
            <input type="checkbox" id="detail-myday"> 添加到"TODO"
          </label>
        </div>
        <div class="detail-row checkbox-row">
          <label>
            <input type="checkbox" id="detail-important"> 标记为重要
          </label>
        </div>
        <div class="detail-actions">
          <button type="submit" class="btn-primary">保存</button>
          <button type="button" class="btn-danger" id="btn-delete-task">删除</button>
        </div>
      </form>
    </div>
  </div>

  <div id="mini-panel" class="mini-panel hidden">
    <div class="mini-header">
      <span class="mini-title" id="mini-drag-region">待办事项</span>
      <div class="mini-actions">
        <button class="mini-btn" id="btn-mini-add" title="快速添加">+</button>
        <button class="mini-btn" id="btn-exit-mini" title="恢复窗口">⊞</button>
      </div>
    </div>
    <div class="mini-stats">
      <span class="mini-stat-item"><span id="mini-pending-count">0</span> 待办</span>
      <span class="mini-stat-item"><span id="mini-done-count">0</span> 已完成</span>
    </div>
    <div class="mini-list" id="mini-list"></div>
    <div class="mini-input-row hidden" id="mini-input-row">
      <input type="text" id="mini-quick-add" placeholder="添加任务...">
    </div>
    <div class="mini-tooltip hidden" id="mini-tooltip"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
