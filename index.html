<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="./icon.png">
  <title>待办事项</title>
</head>
<body>
  <div class="app">
    <!-- 左侧边栏 -->
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>待办事项</h2>
        <div class="header-actions">
          <button class="btn-header-action" id="btn-theme-toggle" title="切换主题">🌗</button>
          <button class="btn-header-action" id="btn-mini-mode" title="迷你模式">📌</button>
        </div>
        <span class="date" id="today-date"></span>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-item active" data-list="todo" title="TODO">
          <span class="nav-icon">☀️</span>
          <span class="nav-text">TODO</span>
          <span class="nav-count" id="count-todo">0</span>
        </a>
        <a href="#" class="nav-item" data-list="important" title="重要">
          <span class="nav-icon">⭐</span>
          <span class="nav-text">重要</span>
          <span class="nav-count" id="count-important">0</span>
        </a>
        <a href="#" class="nav-item" data-list="all" title="所有">
          <span class="nav-icon">📦</span>
          <span class="nav-text">所有</span>
          <span class="nav-count" id="count-all">0</span>
        </a>
        <a href="#" class="nav-item" data-list="archived" title="归档">
          <span class="nav-icon">🗃️</span>
          <span class="nav-text">归档</span>
          <span class="nav-count" id="count-archived">0</span>
        </a>
        <a href="#" class="nav-item" data-list="calendar" title="日历">
          <span class="nav-icon">📅</span>
          <span class="nav-text">日历</span>
          <span class="nav-count"></span>
        </a>
      </nav>
      <div class="sidebar-section">
        <div class="section-title">标签</div>
        <div id="tag-list" class="tag-list"></div>
        <div class="tag-actions">
          <a href="#" class="nav-item add-tag" id="btn-add-tag">
            <span class="nav-icon">+</span>
            <span class="nav-text">新建标签</span>
          </a>
          <a href="#" class="nav-item add-tag" id="btn-manage-tags">
            <span class="nav-icon">⚙️</span>
            <span class="nav-text">管理标签</span>
          </a>
        </div>
      </div>
      <div class="sidebar-footer">
        <button id="btn-mini-mode-footer" class="btn-mini-mode-footer" title="迷你模式"><span class="btn-icon">📌</span><span class="btn-text"> 迷你模式</span></button>
        <button id="btn-toggle-sidebar" class="btn-toggle-sidebar" title="折叠侧边栏"><span class="btn-icon">◀️</span><span class="btn-text"> 折叠侧边栏</span></button>
        <button id="btn-clear-done" title="清空已完成"><span class="btn-icon">🗑️</span><span class="btn-text"> 清空已完成</span></button>
      </div>
    </aside>

    <!-- 主内容区 -->
    <main class="main-content">
      <!-- 列表视图 -->
      <div id="view-list" class="view active">
        <div class="main-header">
          <div>
            <h1 id="list-title">TODO</h1>
            <span class="task-summary" id="task-summary"></span>
          </div>
          <button class="icon-btn" id="btn-search" title="搜索">🔍</button>
        </div>
        <div class="search-bar hidden" id="search-bar">
          <input type="text" id="search-input" placeholder="搜索任务..." autocomplete="off">
          <button class="icon-btn" id="btn-search-close" title="关闭搜索">✕</button>
        </div>
        <!-- 添加任务 -->
        <div class="add-task-bar">
          <span class="add-icon">➕</span>
          <input type="text" id="quick-add" placeholder="添加新任务..." autocomplete="off">
          <div class="add-task-actions">
            <button class="icon-btn" id="btn-set-date" title="设置日期">📅</button>
            <button class="icon-btn" id="btn-set-priority" title="设置优先级">🚩</button>
            <button class="icon-btn" id="btn-set-tag" title="设置标签">🏷️</button>
          </div>
        </div>
        <!-- 任务列表 -->
        <div id="todo-list" class="todo-list"></div>
        <!-- 已完成折叠 -->
        <div id="done-section" class="done-section">
          <div class="done-header" id="done-toggle">
            <span>已完成 (<span id="done-count">0</span>)</span>
            <div class="done-header-actions">
              <button class="btn-archive-all" id="btn-archive-done" title="归档已完成">🗃️ 归档</button>
              <span class="arrow">▼</span>
            </div>
          </div>
          <div id="done-list-wrapper" class="done-list-wrapper">
            <div id="done-list" class="todo-list"></div>
          </div>
        </div>
      </div>

      <!-- 日历视图 -->
      <div id="view-calendar" class="view">
        <div class="main-header">
          <div>
            <h1>日历</h1>
          </div>
          <button class="btn-ai-summary" id="btn-open-summary" title="AI 总结">📝 AI 总结</button>
        </div>
        <div class="calendar-container">
          <div class="calendar-nav">
            <button class="icon-btn" id="prev-month">◀️</button>
            <button class="calendar-title-btn" id="calendar-title" title="点击选择年月"></button>
            <button class="icon-btn" id="btn-today" title="今天">📅</button>
            <button class="icon-btn" id="next-month">▶️</button>
          </div>
          <div class="calendar-grid">
            <div class="calendar-weekdays">
              <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
            </div>
            <div id="calendar-days" class="calendar-days"></div>
          </div>
          <div id="calendar-detail" class="calendar-detail"></div>
        </div>
      </div>

      <!-- 底部状态栏 -->
      <div class="status-bar">
        <span id="status-text"></span>
      </div>
    </main>
  </div>

  <!-- 任务详情面板 -->
  <div id="detail-panel" class="detail-panel hidden">
    <div class="detail-header">
      <h3>编辑任务</h3>
      <button class="icon-btn" id="close-detail">✕</button>
    </div>
    <form id="detail-form">
      <input type="hidden" id="detail-id">
      <div class="detail-row">
        <label>标题</label>
        <input type="text" id="detail-title" required>
      </div>
      <div class="detail-row">
        <label>备注</label>
        <textarea id="detail-desc" placeholder="添加备注..."></textarea>
      </div>
      <div class="detail-row-inline">
        <div class="detail-row">
          <label>优先级</label>
          <select id="detail-priority">
            <option value="none">无</option>
            <option value="low">低</option>
            <option value="medium">中</option>
            <option value="high">高</option>
          </select>
        </div>
        <div class="detail-row">
          <label>标签</label>
          <input type="text" id="detail-tag" placeholder="标签" list="tag-datalist">
          <datalist id="tag-datalist"></datalist>
        </div>
      </div>
      <div class="detail-row-inline">
        <div class="detail-row">
          <label>开始时间</label>
          <input type="text" id="detail-start" data-dp-mode="datetime">
        </div>
        <div class="detail-row">
          <label>截止时间</label>
          <input type="text" id="detail-end" data-dp-mode="datetime">
        </div>
      </div>
      <div class="detail-row-inline">
        <div class="detail-row">
          <label>提醒时间</label>
          <input type="text" id="detail-reminder" data-dp-mode="datetime">
        </div>
        <div class="detail-row">
          <label>重复提醒</label>
          <select id="detail-reminder-repeat">
            <option value="none">不重复</option>
            <option value="daily">每天</option>
            <option value="weekly">每周</option>
            <option value="monthly">每月</option>
          </select>
        </div>
      </div>
      <div class="detail-row checkbox-row">
        <label>
          <input type="checkbox" id="detail-todo"> 添加到"TODO"
        </label>
      </div>
      <div class="detail-row checkbox-row">
        <label>
          <input type="checkbox" id="detail-important"> 标记为重要
        </label>
      </div>
      <div class="detail-row detail-done-time hidden" id="detail-done-row">
        <label>完成时间</label>
        <span id="detail-done-time" class="detail-done-value"></span>
      </div>
      <div class="detail-row detail-created-time" id="detail-created-row">
        <label>创建时间</label>
        <span id="detail-created-time" class="detail-created-value"></span>
      </div>
      <div class="detail-actions">
        <button type="submit" class="btn-primary">保存</button>
        <button type="button" class="btn-danger" id="btn-delete-task">删除</button>
      </div>
    </form>
  </div>

  <!-- AI 总结面板 -->
  <div id="summary-panel" class="summary-panel hidden">
    <div class="summary-header">
      <h3>AI 总结</h3>
      <div class="summary-header-actions">
        <button class="icon-btn" id="btn-ai-config" title="API 配置">⚙</button>
        <button class="icon-btn" id="close-summary">✕</button>
      </div>
    </div>
    <div class="summary-controls">
      <div class="summary-type-tabs">
        <button class="summary-tab active" data-type="daily">日报</button>
        <button class="summary-tab" data-type="weekly">周报</button>
      </div>
      <div class="summary-date-row">
        <label>日期</label>
        <input type="text" id="summary-date" data-dp-mode="date">
      </div>
      <button class="btn-primary" id="btn-generate-report">生成报告</button>
    </div>
    <div class="summary-output" id="summary-output">
      <div class="summary-placeholder">选择日期并点击"生成报告"</div>
    </div>
    <div class="summary-footer hidden" id="summary-footer">
      <button class="btn-copy" id="btn-copy-report">复制内容</button>
    </div>
  </div>

  <div id="mini-panel" class="mini-panel hidden">
    <div class="mini-header">
      <span class="mini-title" id="mini-drag-region">待办事项</span>
      <div class="mini-actions">
        <button class="mini-btn" id="btn-mini-add" title="快速添加">➕</button>
        <button class="mini-btn" id="btn-exit-mini" title="恢复窗口">🪟</button>
      </div>
    </div>
    <div class="mini-stats">
      <span class="mini-stat-item"><span id="mini-pending-count">0</span> 待办</span>
      <span class="mini-stat-item"><span id="mini-done-count">0</span> 已完成</span>
    </div>
    <div class="mini-list" id="mini-list"></div>
    <div class="mini-input-row hidden" id="mini-input-row">
      <input type="text" id="mini-quick-add" placeholder="添加任务...">
    </div>
    <div class="mini-tooltip hidden" id="mini-tooltip"></div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
